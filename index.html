<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#234d59" />
    <title>Our Drawing World · The painted harbor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="toolbar" aria-label="Adventure tools">
        <div class="sister-controls" aria-label="Choose a sister">
          <button id="keila" class="sister keila" aria-pressed="true">
            <span class="portrait" aria-hidden="true"></span><span>Keila</span>
          </button>
          <button id="olivia" class="sister olivia" aria-pressed="false">
            <span class="portrait" aria-hidden="true"></span><span>Olivia</span>
          </button>
        </div>
        <span id="place">The painted harbor</span>
        <nav aria-label="Your discoveries">
          <button id="amulet" aria-label="Look at the heart amulet">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 28 4 16C-4 5 9-2 16 7 23-2 36 5 28 16Z" />
              <path class="missing" d="M16 23 8 15C3 8 11 3 16 10 21 3 29 8 24 15Z" /></svg
            ><span>Amulet</span>
          </button>
          <button id="book" aria-label="Open your sticker book">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 7Q9 3 3 6v22q7-3 13 0 6-3 13 0V6Q23 3 16 7v21" />
              <path d="m23 11 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" /></svg
            ><span>Stickers</span><span id="sticker-dot" hidden></span>
          </button>
          <button id="hint" aria-label="Show a hint">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path d="M10 21C-2 8 9-2 19 3c10 4 8 13 3 18l-1 3H11Z M12 28h8 M16 10v7" /></svg
            ><span>Hint</span>
          </button>
          <div id="settings-wrap">
            <button
              id="settings"
              aria-label="Game settings"
              aria-expanded="false"
              aria-controls="settings-menu"
            >
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path
                  d="m13 3 6 0 1 4 3 2 4-1 3 5-3 3v3l3 3-3 5-4-1-3 2-1 3h-6l-1-3-3-2-4 1-3-5 3-3v-3l-3-3 3-5 4 1 3-2Z"
                />
                <circle cx="16" cy="17" r="5" />
              </svg>
            </button>
            <section id="settings-menu" aria-label="Game settings" hidden>
              <button id="fullscreen">Full screen</button>
              <button
                id="sound"
                aria-pressed="false"
                title="AI-generated character voices. Captions remain visible."
              >
                Mute voices
              </button>
              <button id="restart" aria-describedby="reset-help">Start over</button>
              <p id="reset-help">This chapter only. Hold to reset everything.</p>
              <details>
                <summary>More tools</summary>
                <button id="effects" aria-pressed="true">Sounds: on</button>
                <button id="editor" aria-pressed="false" title="Caper scene editor (Shift+E)">Editor</button>
                <button id="restart-all">Reset entire adventure…</button>
              </details>
            </section>
          </div>
        </nav>
      </header>
      <main class="stage" id="stage" aria-label="Our Drawing World adventure">
        <div id="game" aria-label="Click or tap the harbor to walk and explore"></div>
        <p id="status" class="sr-only" role="status">Click or tap to explore.</p>
        <div id="loading" role="status">
          <h1>Our Drawing World</h1>
          <p>Opening the painted harbor…</p>
        </div>
        <section id="dialogue" hidden aria-live="polite" aria-label="Story dialogue">
          <div>
            <strong id="speaker"></strong>
            <p id="line"></p>
          </div>
          <button id="next" class="primary">Next <span aria-hidden="true">→</span></button>
        </section>
        <div id="panel-shade" hidden>
          <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
            <button id="close-panel" class="close" aria-label="Close">×</button>
            <h1 id="panel-title"></h1>
            <div id="panel-body"></div>
          </section>
        </div>
      </main>
      <button id="save-layout" hidden>Save layout here</button>
      <p id="display-notice" role="status" hidden></p>
      <p class="rotate-note">A little more room to draw: try turning your screen sideways.</p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
